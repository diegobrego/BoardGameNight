<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board Game Night</title>
  <meta name="description" content="Pick the days you're available, see when enough of us can play, and suggest games.">
  <meta property="og:title" content="Board Game Night">
  <meta property="og:description" content="Pick the days you're available, see when enough of us can play, and suggest games.">
  <meta name="theme-color" content="#6d28d9">
  <!-- Pick the theme before the page paints, so there's no flash of the wrong one:
       the saved choice if there is one, otherwise the device's setting. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('bgn.theme'); } catch (e) { /* private mode */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand"><span class="brand-icon" id="brand-icon"></span><span>Board Game Night</span></h1>
      <div class="top-right">
        <button type="button" id="theme-btn" class="theme-btn" data-action="theme"></button>
        <div id="me-slot"></div>
      </div>
    </header>

    <section id="reminder" class="reminder" aria-label="Game night reminder" hidden></section>

    <div id="banner" class="banner" role="status" hidden></div>

    <main>
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title">Next 2 weeks</h2>
          <span id="range" class="range"></span>
        </div>
        <div id="toolbar" class="toolbar"></div>
        <div id="calendar" class="calendar"></div>
        <ul id="legend" class="legend"></ul>
      </section>

      <section id="crew" class="crew" hidden></section>
    </main>

    <footer class="foot">
      <p>Game links go to <a href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer">BoardGameGeek</a>. Not affiliated with BGG.</p>
      <p id="admin-slot" class="foot-admin"></p>
    </footer>
  </div>

  <div id="savebar" class="savebar" hidden></div>
  <dialog id="day-dialog" class="sheet" aria-labelledby="dp-title"></dialog>
  <dialog id="who-dialog" class="sheet"></dialog>
  <dialog id="confirm-dialog" class="sheet"></dialog>
  <dialog id="info-dialog" class="sheet"></dialog>
  <dialog id="admin-dialog" class="sheet"></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
