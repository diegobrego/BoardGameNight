<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board Game Night</title>
  <meta name="description" content="Pick the days you're available, see when enough of us can play, and suggest games.">
  <meta property="og:title" content="Board Game Night">
  <meta property="og:description" content="Pick the days you're available, see when enough of us can play, and suggest games.">
  <meta name="theme-color" content="#6d28d9">
  <!-- Pick the theme (and which page's colours) before the page paints, so there's no flash
       of the wrong ones: the saved theme if there is one, otherwise the device's setting. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('bgn.theme'); } catch (e) { /* private mode */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-page', location.hash === '#hall' ? 'hall' : location.hash === '#campaigns' ? 'campaigns' : 'calendar');
    })();
  </script>
  <link rel="icon" id="favicon" href="data:,">
  <!-- Installable as an app (add to home screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand"><span class="brand-icon" id="brand-icon"></span><span>Board Game Night</span></h1>
      <div class="top-right">
        <a id="help-btn" class="theme-btn help-link" href="help.html" aria-label="Help: how the site works" title="Help: how the site works">?</a>
        <button type="button" id="theme-btn" class="theme-btn" data-action="theme"></button>
        <div id="me-slot"></div>
      </div>
    </header>

    <nav class="tabs" aria-label="Pages">
      <a id="tab-calendar" class="tab" href="#calendar"></a>
      <a id="tab-campaigns" class="tab" href="#campaigns"></a>
      <a id="tab-hall" class="tab" href="#hall"></a>
      <a id="tab-admin" class="tab" href="#admin" hidden></a>
    </nav>

    <section id="reminder" class="reminder" aria-label="Game night reminder" hidden></section>

    <div id="banner" class="banner" role="status" hidden></div>
    <div id="update" class="banner" role="status" hidden></div>

    <main>
      <div id="view-calendar">
        <section class="board" aria-labelledby="board-title">
          <div class="board-head">
            <h2 id="board-title">Next 2 weeks</h2>
            <span id="range" class="range"></span>
          </div>
          <div id="toolbar" class="toolbar"></div>
          <div id="lastweek" class="lastweek"></div>
          <div id="calendar" class="calendar"></div>
          <ul id="legend" class="legend"></ul>
        </section>

        <section id="crew" class="crew" hidden></section>
      </div>

      <div id="view-campaigns" hidden>
        <section class="board campaigns" aria-labelledby="campaigns-title">
          <div class="board-head">
            <h2 id="campaigns-title">Campaigns</h2>
            <span id="campaigns-count" class="range"></span>
          </div>
          <div id="campaigns-body"></div>
        </section>
      </div>

      <div id="view-hall" hidden>
        <section class="board hall" aria-labelledby="hall-title">
          <div class="board-head">
            <h2 id="hall-title">Hall of fame</h2>
            <span id="hall-count" class="range"></span>
          </div>
          <div id="hall-body"></div>
        </section>
      </div>

      <div id="view-admin" hidden>
        <section class="board admin" aria-labelledby="admin-title">
          <div class="board-head">
            <h2 id="admin-title">Admin</h2>
            <span id="admin-count" class="range"></span>
          </div>
          <div id="admin-body"></div>
        </section>
      </div>
    </main>

    <footer class="foot">
      <p>Game links go to <a href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer">BoardGameGeek</a>. Not affiliated with BGG.</p>
      <p><a href="help.html">How it works</a></p>
      <p id="install-slot" class="foot-admin"></p>
      <p id="admin-slot" class="foot-admin"></p>
    </footer>
  </div>

  <div id="savebar" class="savebar" hidden></div>
  <dialog id="day-dialog" class="sheet" aria-labelledby="dp-title"></dialog>
  <dialog id="details-dialog" class="sheet"></dialog>
  <dialog id="log-dialog" class="sheet"></dialog>
  <dialog id="campaign-dialog" class="sheet"></dialog>
  <dialog id="form-dialog" class="sheet"></dialog>
  <dialog id="player-dialog" class="sheet"></dialog>
  <dialog id="who-dialog" class="sheet"></dialog>
  <dialog id="confirm-dialog" class="sheet"></dialog>
  <dialog id="info-dialog" class="sheet"></dialog>
  <dialog id="admin-dialog" class="sheet"></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
